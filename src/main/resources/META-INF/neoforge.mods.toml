[[mods]]
modId="productivemetalsatm10compat"
version="${file.jarVersion}"
displayName="ProductiveMetals ATM10 Compat"
authors="ErtzFiend"
description='''
All The Mods 10 custom melting/casting content, packaged as a mod.
Requires KubeJS (scripts are bundled in kubejs/server_scripts and extracted
automatically on start). Adds Productive Metalworks melting recipes for every
ingot/gem tool & armor piece, misc metal items (cauldrons, buckets, anvils,
shears, minecarts, crossbows, golden apples), the quartz block family,
Create-family items (coins, wires, rods, plates-crafted machines), and a
molten-carbon -> coal-block casting-basin recipe.
'''

[[dependencies.productivemetalsatm10compat]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.productivemetalsatm10compat]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"

[[dependencies.productivemetalsatm10compat]]
    modId="kubejs"
    type="required"
    versionRange="[2101.7.0-build.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.productivemetalsatm10compat]]
