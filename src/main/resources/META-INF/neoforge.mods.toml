    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"

[[dependencies.productivemetalsatm10compat]]
    modId="kubejs"
    type="required"
    versionRange="[2101.7.0-build.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.productivemetalsatm10compat]]
