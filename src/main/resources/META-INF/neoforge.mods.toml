[[mods]]
modId="productivemetalsatm10compat"
version="${file.jarVersion}"
displayName="ProductiveMetals ATM10 Compat"
authors="ErtzFiend"
description='''
All The Mods 10 custom smelting/casting content, packaged as a mod.
Requires KubeJS (scripts are bundled in kubejs/server_scripts and loaded
automatically). Adds Productive Metalworks melting recipes for every
ingot/gem tool & armor piece, melting for misc metal items (cauldrons,
buckets, anvils, minecarts, crossbows, golden apples), the quartz
block/stairs/slab family, and a molten-carbon -> coal-block casting-basin
recipe.
'''

[[dependencies.productivemetalsatm10compat]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.productivemetalsatm10compat]]
