name: Publish to CurseForge

# Push a built jar to the project's CurseForge files.
# Trigger: push a version tag (v1.4.3, ...) OR run manually from the Actions tab.
# Requires repo settings: secret CURSEFORGE_API_KEY (the CF API key) and
# variable CF_PROJECT_ID (numeric project id from the project page URL).
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  curseforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build jar
        run: ./gradlew --no-daemon build -x test

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_API_KEY" ] || { echo "secret CURSEFORGE_API_KEY not set"; exit 1; }
          [ -n "$CF_PROJECT_ID" ] && [ "$CF_PROJECT_ID" != "" ] || { echo "variable CF_PROJECT_ID not set"; exit 1; }

          VERSION=$(grep "^version" build.gradle | sed -E "s/^version = '([^']+)'.*/\1/")
          JAR=$(ls build/libs/productivemetals-atm10-compat-"$VERSION".jar 2>/dev/null | head -1)
          [ -n "$JAR" ] || { echo "no jar found for version $VERSION"; ls build/libs/ || true; exit 1; }
          echo "Uploading: $JAR"

          TAG="${GITHUB_REF_NAME:-manual}"
          if [ "$TAG" = "manual" ]; then
            CHANGELOG="$(git log -1 --format='%s')"
          else
            CHANGELOG="$(git log --format='- %s' "$TAG"~1.."$TAG" 2>/dev/null || git log -1 --format='- %s')"
          fi
          [ -n "$CHANGELOG" ] || CHANGELOG="Release $VERSION"

          METADATA=$(jq -nc --arg v "$VERSION" --arg cl "$CHANGELOG" '{
            changelog: $cl,
            changelogType: "markdown",
            displayName: ("ProductiveMetals ATM10 Compat " + $v),
            gameVersions: ["1.21.1"],
            releaseType: "release",
            relations: [
              {slug: "kubejs", type: 3},
              {slug: "productive-metalworks", type: 3}
            ]
          }')

          CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -H "x-api-key: $CF_API_KEY" \
            -F "metadata=$METADATA" \
            -F "file=@$JAR" \
            "https://minecraft.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file")
          echo "HTTP $CODE"
          cat response.json
          echo
          [ "$CODE" = "200" ] || exit 1